<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ola Ride Booking</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>Ola Ride Booking</h1>
      </header>
      <main>
        <form id="bookingForm">
          <div class="form-group">
            <label for="pickup">Pickup Location</label>
            <input
              type="text"
              id="pickup"
              placeholder="Enter pickup point"
              required
            />
          </div>

          <div class="form-group">
            <label for="drop">Drop Location</label>
            <input
              type="text"
              id="drop"
              placeholder="Enter drop location"
              required
            />
          </div>

          <div class="form-group">
            <label for="vehicle">Vehicle Type</label>
            <select id="vehicle">
              <option value="micro">Micro</option>
              <option value="mini">Mini</option>
              <option value="prime">Prime Sedan</option>
              <option value="suv">SUV</option>
              <option value="auto">Auto</option>
            </select>
          </div>

          <div class="form-group time-group">
            <label for="time">Pickup Time</label>
            <input type="time" id="time" />
          </div>

          <button type="button" id="estimateBtn">Get Fare Estimate</button>

          <div id="estimate" class="fare-estimate hidden"></div>

          <button type="submit" id="bookBtn" class="hidden">Book Now</button>
        </form>
      </main>
      <footer>
        <p>&copy; 2025 Ola Cabs</p>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
